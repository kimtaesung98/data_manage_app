name: data_manage_app
description: "노인 상태 모니터링 및 데이터 브릿지 앱 — Wear BLE → WiFi → Firestore"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # State management
  provider: ^6.1.2

  # Connectivity monitoring
  connectivity_plus: ^6.1.0

  # Bluetooth (Wear device scanning)
  flutter_blue_plus: ^1.31.15

  # Background foreground service
  flutter_background_service: ^5.0.9

  # Local packet buffer
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
